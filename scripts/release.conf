# Over-the-air update settings (no secrets here). Put your real values in scripts/release.local.conf
# (gitignored), which overrides this file.
# RELEASES_REPO:  GitHub repo whose Releases hold the update archives, e.g. "your-account/Openflow".
# GH_ACCOUNT:     the gh account that publishes (gh auth login; it does not need to be the active account).
# APPCAST_BRANCH: branch that holds appcast.xml, kept separate from the code history.
RELEASES_REPO=""
GH_ACCOUNT=""
APPCAST_BRANCH="updates"
[[ -f "$(dirname "${BASH_SOURCE[0]}")/release.local.conf" ]] && source "$(dirname "${BASH_SOURCE[0]}")/release.local.conf"
